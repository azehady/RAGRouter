[project]
name = "ragrouter"
version = "0.1.0"
description = "Meta-RAG orchestration: route queries to the best RAG paradigm, arbitrate results"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
hybrid = [
    "haystack-ai>=2.9.0",
    "qdrant-haystack>=6.0.0",
    "qdrant-client>=1.12.0",
    "flashrank>=0.2.0",
    "fastembed>=0.4.0",
]
baseline = [
    "qdrant-client>=1.12.0",
    "openai>=1.10.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.8.0",
]
all = ["ragrouter[hybrid,baseline,eval,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragrouter"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
