apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-engine
  namespace: ciroos-rag
  labels:
    app: graph-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-engine
  template:
    metadata:
      labels:
        app: graph-engine
    spec:
      containers:
        - name: graph-engine
          image: graph-engine:latest
          ports:
            - containerPort: 8004
          env:
            - name: GRAPH_WEBSTER_URL
              value: "http://webster.ciroos.svc.cluster.local:8000"
            - name: GRAPH_KGRAPH_URL
              value: "http://kgraph.ciroos.svc.cluster.local:8000"
            - name: GRAPH_LITELLM_API_BASE
              value: "http://litellm.ciroos.svc.cluster.local:4000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: graph-engine
  namespace: ciroos-rag
spec:
  selector:
    app: graph-engine
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
