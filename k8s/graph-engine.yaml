apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-engine
  namespace: ciroos-rag
  labels:
    app: graph-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-engine
  template:
    metadata:
      labels:
        app: graph-engine
    spec:
      containers:
        - name: graph-engine
          image: localhost:32000/ragrouter/graph-engine:latest
          ports:
            - containerPort: 8004
          env:
            - name: GRAPH_WEBSTER_URL
              value: "http://webster.ciroos.svc.cluster.local:8000"
            - name: GRAPH_KGRAPH_URL
              value: "http://kgraph.ciroos.svc.cluster.local:80"
            - name: GRAPH_LITELLM_API_BASE
              value: "http://litellm-service.ciroos.svc.cluster.local"
            - name: GRAPH_LITELLM_MODEL
              value: "gpt-4o-mini"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: graph-engine
  namespace: ciroos-rag
spec:
  selector:
    app: graph-engine
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
