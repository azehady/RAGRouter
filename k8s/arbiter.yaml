apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbiter
  namespace: ciroos-rag
  labels:
    app: arbiter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arbiter
  template:
    metadata:
      labels:
        app: arbiter
    spec:
      containers:
        - name: arbiter
          image: localhost:32000/ragrouter/arbiter:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: arbiter
  namespace: ciroos-rag
spec:
  selector:
    app: arbiter
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
